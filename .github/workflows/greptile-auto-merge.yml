name: Greptile 5/5 Auto Merge

on:
  workflow_call:
    inputs:
      check_run_id:
        description: Completed Greptile check run ID from the caller event
        required: true
        type: number
      check_head_sha:
        description: Commit SHA associated with the Greptile check run
        required: true
        type: string

permissions:
  checks: read
  contents: write
  pull-requests: write

jobs:
  queue-auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the successful Greptile check and queue eligible PRs
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN_ID: ${{ inputs.check_run_id }}
          CHECK_HEAD_SHA: ${{ inputs.check_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHECK_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CHECK_HEAD_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          check_run=$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_RUN_ID")
          jq -e --arg sha "$CHECK_HEAD_SHA" \
            '.name == "Greptile Apps" and .app.slug == "greptile-apps" and .status == "completed" and .conclusion == "success" and .head_sha == $sha' \
            <<<"$check_run" >/dev/null
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')
          pull_requests=$(gh api "repos/$GITHUB_REPOSITORY/commits/$CHECK_HEAD_SHA/pulls?per_page=100")
          mapfile -t eligible_prs < <(jq -r --arg base "$default_branch" --arg sha "$CHECK_HEAD_SHA" \
            '.[] | select(.state == "open" and .draft == false and .base.ref == $base and .head.sha == $sha) | .number' \
            <<<"$pull_requests")
          for number in "${eligible_prs[@]}"; do
            gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --auto --squash
          done
