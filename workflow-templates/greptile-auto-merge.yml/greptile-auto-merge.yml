name: Greptile 5/5 Auto Merge

on:
  check_run:
    types: [completed]

permissions:
  checks: read
  contents: write
  pull-requests: write

jobs:
  auto-merge-after-greptile-5-of-5:
    if: >-
      github.event.check_run.name == 'Greptile Apps' &&
      github.event.check_run.app.slug == 'greptile-apps' &&
      github.event.check_run.conclusion == 'success'
    uses: mylescorp/.github/.github/workflows/greptile-auto-merge.yml@main
    with:
      check_run_id: ${{ github.event.check_run.id }}
      check_head_sha: ${{ github.event.check_run.head_sha }}
